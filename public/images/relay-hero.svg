<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Warm editorial illustration of a sunlit arch and landscape">
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9C9AF" />
      <stop offset="0.48" stop-color="#C2B091" />
      <stop offset="1" stop-color="#6F806C" />
    </linearGradient>
    <radialGradient id="hero-glow" cx="0.72" cy="0.18" r="0.62">
      <stop offset="0" stop-color="#F8EED8" stop-opacity="0.95" />
      <stop offset="0.55" stop-color="#F8EED8" stop-opacity="0.3" />
      <stop offset="1" stop-color="#F8EED8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="hero-hill" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#8B997D" />
      <stop offset="1" stop-color="#2E4939" />
    </linearGradient>
    <linearGradient id="hero-arch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF8" stop-opacity="0.34" />
      <stop offset="1" stop-color="#FFFDF8" stop-opacity="0.04" />
    </linearGradient>
    <filter id="hero-grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.09" />
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="900" height="1000" fill="url(#hero-bg)" />
